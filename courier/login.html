<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Login Entregador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-primary-xicoma d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="bg-white p-5 rounded-4 shadow-lg text-center mx-3" style="width: 100%; max-width: 380px;">
        <div class="mb-4">
            <div class="bg-primary-xicoma text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 70px; height: 70px;">
                <i class="bi bi-bicycle display-5"></i>
            </div>
            <h3 class="fw-bold mb-0">Entregador</h3>
            <p class="text-muted">Faça parte da nossa frota</p>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" value="moto@xicoma.com">
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" value="123">
                <label for="password">Senha</label>
            </div>

            <button type="submit" id="btn-login" class="btn btn-dark w-100 py-3 rounded-pill fw-bold mb-3">Iniciar
                Corrida</button>
        </form>

        <div class="text-center">
            <a href="../client/login.html" class="text-decoration-none text-muted small">Voltar para Cliente</a>
        </div>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            btn.innerText = 'Autenticando...';
            btn.disabled = true;

            setTimeout(() => {
                if (xicoma.auth.login(email, password, 'courier')) {
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Acesso negado.');
                    btn.innerText = 'Iniciar Corrida';
                    btn.disabled = false;
                }
            }, 800);
        });
    </script>
</body>

</html>
