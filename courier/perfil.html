<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Perfil Entregador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <div class="bg-white p-4 shadow-sm mb-3 text-center">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 80px; height: 80px;">
                <i class="bi bi-person-badge display-6 text-dark"></i>
            </div>
            <h5 class="fw-bold mb-0" id="u-name">...</h5>
            <small class="text-muted mt-1 d-block"><i class="bi bi-star-fill text-warning"></i> 4.9</small>
        </div>

        <div class="p-3">
            <div class="bg-white p-3 rounded-card shadow-sm mb-4">
                <h6 class="fw-bold border-bottom pb-2 mb-3">Veículo</h6>
                <div class="d-flex justify-content-between">
                    <span class="text-muted">Modelo</span>
                    <span class="fw-bold" id="veh-type">...</span>
                </div>
                <div class="d-flex justify-content-between mt-2">
                    <span class="text-muted">Placa</span>
                    <span class="fw-bold" id="veh-plate">...</span>
                </div>
            </div>

            <div class="list-group rounded-card shadow-sm border-0 mb-4 bg-white">
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i
                        class="bi bi-file-text me-2"></i> Documentos</a>
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i class="bi bi-gear me-2"></i>
                    Configurações</a>
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i
                        class="bi bi-headset me-2"></i> Suporte</a>
            </div>

            <button onclick="xicoma.auth.logout()" class="btn btn-outline-danger w-100 py-3 rounded-pill fw-bold">
                Sair
            </button>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="bi bi-speedometer2"></i> Painel
            </a>
            <a href="pedidos-disponiveis.html" class="nav-item">
                <i class="bi bi-box-seam"></i> Entregas
            </a>
            <a href="ganhos.html" class="nav-item">
                <i class="bi bi-wallet2"></i> Ganhos
            </a>
            <a href="perfil.html" class="nav-item active">
                <i class="bi bi-person-fill"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('courier');
        const user = xicoma.auth.currentUser;

        document.getElementById('u-name').innerText = user.name;
        document.getElementById('veh-type').innerText = user.vehicle;
        document.getElementById('veh-plate').innerText = user.plate;
    </script>
</body>

</html>
