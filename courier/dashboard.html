<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Dashboard Entregador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .status-toggle {
            cursor: pointer;
            transition: all 0.3s;
        }

        .status-online {
            background-color: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
        }

        .status-offline {
            background-color: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
        }
    </style>
</head>

<body class="bg-light">

    <div class="app-container">
        <!-- Header -->
        <div class="bg-white p-3 shadow-sm d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
                <div class="bg-light p-2 rounded-circle me-2"><i class="bi bi-person-fill"></i></div>
                <div>
                    <span class="fw-bold d-block" id="c-name">...</span>
                    <small class="text-muted" id="c-veh">...</small>
                </div>
            </div>
            <div class="status-toggle px-3 py-2 rounded-pill status-online fw-bold small" id="status-badge"
                onclick="toggleStatus()">
                <i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i> Online
            </div>
        </div>

        <div class="p-3">
            <!-- Stats -->
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <div class="bg-white p-3 rounded-card shadow-sm text-center">
                        <small class="text-muted d-block mb-1">Ganhos Hoje</small>
                        <h4 class="fw-bold text-success m-0" id="today-earnings">0 MT</h4>
                    </div>
                </div>
                <div class="col-6">
                    <div class="bg-white p-3 rounded-card shadow-sm text-center">
                        <small class="text-muted d-block mb-1">Entregas</small>
                        <h4 class="fw-bold m-0" id="today-count">0</h4>
                    </div>
                </div>
            </div>

            <!-- Action Card -->
            <a href="pedidos-disponiveis.html"
                class="card bg-primary-xicoma text-white border-0 shadow rounded-card mb-4 text-decoration-none">
                <div class="card-body p-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="fw-bold mb-1">Novas Entregas</h5>
                        <p class="mb-0 opacity-75">Existe <span class="fw-bold bg-white text-danger px-1 rounded"
                                id="new-orders">0</span> pedidos aguardando.</p>
                    </div>
                    <i class="bi bi-arrow-right-circle fs-1"></i>
                </div>
            </a>

            <!-- Recent -->
            <h6 class="fw-bold mb-3">Histórico Recente</h6>
            <div id="recent-list">
                <!-- JS -->
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item active">
                <i class="bi bi-speedometer2"></i> Painel
            </a>
            <a href="pedidos-disponiveis.html" class="nav-item">
                <i class="bi bi-box-seam"></i> Entregas
            </a>
            <a href="ganhos.html" class="nav-item">
                <i class="bi bi-wallet2"></i> Ganhos
            </a>
            <a href="perfil.html" class="nav-item">
                <i class="bi bi-person"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('courier');
        const user = xicoma.auth.currentUser;

        document.getElementById('c-name').innerText = user.name;
        document.getElementById('c-veh').innerText = user.plate;

        // Toggle Status
        let isOnline = true;
        window.toggleStatus = () => {
            isOnline = !isOnline;
            const badge = document.getElementById('status-badge');
            if (isOnline) {
                badge.className = 'status-toggle px-3 py-2 rounded-pill status-online fw-bold small';
                badge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i> Online';
            } else {
                badge.className = 'status-toggle px-3 py-2 rounded-pill status-offline fw-bold small';
                badge.innerHTML = '<i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i> Offline';
            }
        };

        // Poll for Data
        function updateDashboard() {
            xicoma.db.init(); // Refresh
            const ready = xicoma.db.get('orders').filter(o => o.status === 'ready');
            document.getElementById('new-orders').innerText = ready.length;

            // My deliveries
            const myDeliveries = xicoma.db.get('orders').filter(o => o.courierId === user.id && o.status === 'delivered');
            const today = new Date().toISOString().split('T')[0];
            const todayDels = myDeliveries.filter(o => o.createdAt.startsWith(today));

            // Assume 15% flat fee for Courier for simplicity or 50MT fixed
            const earnings = todayDels.length * 50;

            document.getElementById('today-earnings').innerText = xicoma.formatCurrency(earnings);
            document.getElementById('today-count').innerText = todayDels.length;

            const list = document.getElementById('recent-list');
            list.innerHTML = myDeliveries.slice(0, 3).map(o => `
                 <div class="card border-0 shadow-sm rounded-card mb-2">
                    <div class="card-body p-3 d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-0">Entrega #${o.id.toString().slice(-4)}</h6>
                            <small class="text-muted"><i class="bi bi-check-all text-primary-xicoma"></i> Concluída</small>
                        </div>
                        <span class="fw-bold text-success">+50 MT</span>
                    </div>
                </div>
            `).join('');
        }

        updateDashboard();
        setInterval(updateDashboard, 5000);

    </script>
</body>

</html>
