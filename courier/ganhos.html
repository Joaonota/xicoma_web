<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Ganhos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <div class="bg-white p-3 shadow-sm d-flex align-items-center mb-3">
            <a href="dashboard.html" class="btn btn-light rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h5 class="fw-bold m-0">Meus Ganhos</h5>
        </div>

        <div class="p-3">
            <!-- Balance Card -->
            <div
                class="card bg-success text-white border-0 shadow rounded-card mb-4 p-4 text-center position-relative overflow-hidden">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-white opacity-10"
                    style="transform: skewY(-20deg);"></div>
                <p class="mb-1 opacity-75">Saldo Disponível</p>
                <h1 class="fw-bold display-4 mb-3" id="balance">0 MT</h1>
                <button class="btn btn-light rounded-pill px-4 fw-bold text-success shadow-sm">Sacar Agora</button>
            </div>

            <!-- Chart Simulation -->
            <h6 class="fw-bold mb-3">Resumo Semanal</h6>
            <div class="bg-white p-3 rounded-card shadow-sm mb-4">
                <div class="d-flex align-items-end justify-content-between" style="height: 100px;">
                    <div class="text-center w-100">
                        <div class="bg-light rounded mx-auto" style="width: 8px; height: 40px;"></div>
                        <small class="text-muted" style="font-size: 10px;">Seg</small>
                    </div>
                    <div class="text-center w-100">
                        <div class="bg-light rounded mx-auto" style="width: 8px; height: 60px;"></div>
                        <small class="text-muted" style="font-size: 10px;">Ter</small>
                    </div>
                    <div class="text-center w-100">
                        <div class="bg-light rounded mx-auto" style="width: 8px; height: 30px;"></div>
                        <small class="text-muted" style="font-size: 10px;">Qua</small>
                    </div>
                    <div class="text-center w-100">
                        <div class="bg-success rounded mx-auto" style="width: 8px; height: 80px;"></div>
                        <small class="text-muted fw-bold" style="font-size: 10px;">Hoje</small>
                    </div>
                    <div class="text-center w-100">
                        <div class="bg-light rounded mx-auto" style="width: 8px; height: 20px;"></div>
                        <small class="text-muted" style="font-size: 10px;">Sex</small>
                    </div>
                </div>
            </div>

            <h6 class="fw-bold mb-3">Extrato</h6>
            <div id="hist-list">
                <!-- JS -->
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <i class="bi bi-speedometer2"></i> Painel
            </a>
            <a href="pedidos-disponiveis.html" class="nav-item">
                <i class="bi bi-box-seam"></i> Entregas
            </a>
            <a href="ganhos.html" class="nav-item active">
                <i class="bi bi-wallet2"></i> Ganhos
            </a>
            <a href="perfil.html" class="nav-item">
                <i class="bi bi-person"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('courier');
        const cid = xicoma.auth.currentUser.id;

        xicoma.db.init();
        const dels = xicoma.db.get('orders').filter(o => o.courierId === cid && o.status === 'delivered');

        // Assume 50MT per delivery
        const total = dels.length * 50;
        document.getElementById('balance').innerText = xicoma.formatCurrency(total);

        const list = document.getElementById('hist-list');
        list.innerHTML = dels.reverse().map(o => `
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                <div>
                   <h6 class="fw-bold mb-0">Entrega #${o.id.toString().slice(-4)}</h6>
                   <small class="text-muted">${new Date(o.createdAt).toLocaleDateString()}</small>
                </div>
                <span class="text-success fw-bold">+50 MT</span>
            </div>
        `).join('');
    </script>
</body>

</html>
