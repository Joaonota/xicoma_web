<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Em Rota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container h-100 d-flex flex-column">
        <!-- Map Placeholder -->
        <div class="bg-secondary bg-opacity-25 w-100 flex-grow-1 position-relative" style="min-height: 50vh;">
            <div class="position-absolute top-0 start-0 m-3">
                <a href="dashboard.html" class="btn btn-light rounded-circle shadow"><i
                        class="bi bi-chevron-down"></i></a>
            </div>
            <i
                class="bi bi-geo-alt-fill display-1 position-absolute top-50 start-50 translate-middle text-primary-xicoma drop-shadow"></i>
        </div>

        <!-- Bottom Sheet -->
        <div class="bg-white rounded-top-4 p-4 shadow-lg position-relative" style="margin-top: -30px; z-index: 10;">
            <div class="text-center mb-4">
                <div class="bg-light rounded-pill" style="width: 40px; height: 5px; margin: 0 auto;"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 10px;">Cliente</small>
                    <h5 class="fw-bold m-0" id="c-name">...</h5>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-light rounded-circle shadow-sm" onclick="alert('Ligando...')"><i
                            class="bi bi-telephone-fill"></i></button>
                    <button class="btn btn-light rounded-circle shadow-sm" onclick="alert('Abrindo chat...')"><i
                            class="bi bi-chat-dots-fill"></i></button>
                </div>
            </div>

            <div class="bg-light p-3 rounded-card mb-4">
                <div class="d-flex align-items-start">
                    <i class="bi bi-geo-alt-fill text-primary-xicoma mt-1 me-2"></i>
                    <div>
                        <h6 class="fw-bold mb-1">Endereço de Entrega</h6>
                        <p class="text-muted small m-0 mb-2">Av. Julius Nyerere, 1234, Maputo</p>
                        <button class="btn btn-sm btn-outline-dark rounded-pill"><i class="bi bi-cursor-fill"></i>
                            Navegar</button>
                    </div>
                </div>
            </div>

            <div class="d-grid">
                <button onclick="finishDelivery()" class="btn btn-success btn-lg py-3 rounded-pill fw-bold shadow">
                    <i class="bi bi-check-lg me-2"></i> Confirmar Entrega
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('courier');

        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));
        if (!id) window.location.href = 'dashboard.html';

        const order = xicoma.db.get('orders').find(o => o.id === id);
        if (order) {
            document.getElementById('c-name').innerText = order.clientName;
        }

        window.finishDelivery = () => {
            if (confirm('Confirmar entrega realizada?')) {
                xicoma.db.update('orders', id, { status: 'delivered' });
                alert('Entrega concluída! +50 MT na carteira.');
                window.location.href = 'dashboard.html';
            }
        };
    </script>
</body>

</html>
