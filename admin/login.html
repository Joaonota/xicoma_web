<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Animated background blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
        }

        .blob-1 {
            width: 300px;
            height: 300px;
            background: rgba(234, 29, 44, 0.3);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: rgba(255, 71, 87, 0.3);
            bottom: -150px;
            right: -150px;
            animation-delay: 5s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: rgba(139, 0, 0, 0.3);
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }

        .login-container {
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-radius: 24px;
            padding: 3rem;
            animation: float 6s ease-in-out infinite;
        }

        .logo-section {
            margin-bottom: 2rem;
        }

        .logo-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #EA1D2C 0%, #8B0000 100%);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(234, 29, 44, 0.4);
        }

        .form-floating input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .form-floating input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-floating input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.2);
            color: white;
        }

        .form-floating label {
            color: rgba(255, 255, 255, 0.8);
        }

        .form-floating input:focus~label,
        .form-floating input:not(:placeholder-shown)~label {
            color: white;
        }

        .btn-login {
            background: linear-gradient(135deg, #EA1D2C 0%, #ff4757 100%);
            border: none;
            color: white;
            font-weight: 700;
            padding: 1rem;
            border-radius: 50px;
            font-size: 1.1rem;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(234, 29, 44, 0.4);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(234, 29, 44, 0.5);
            color: white;
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        /* Shimmer effect on load */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

    <!-- Animated background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="login-container mx-3" style="width: 100%; max-width: 450px;">
        <div class="login-card scale-in">
            <div class="logo-section text-center">
                <h1 class="logo-text mb-3">XICOMA</h1>
                <span class="admin-badge">ADMIN PANEL</span>
            </div>

            <form id="loginForm" class="mt-4">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" value="admin@xicoma.com">
                    <label for="email"><i class="bi bi-envelope me-2"></i>Email Admin</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" placeholder="Senha" value="admin">
                    <label for="password"><i class="bi bi-lock me-2"></i>Senha</label>
                </div>

                <button type="submit" id="btn-login" class="btn btn-login w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>ACESSAR PAINEL
                </button>
            </form>

            <div class="text-center mt-4">
                <small class="text-white-50">
                    <i class="bi bi-shield-check me-1"></i>
                    Acesso seguro e criptografado
                </small>
            </div>
        </div>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verificando...';
            btn.disabled = true;

            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        });

        // Add shimmer effect on page load
        setTimeout(() => {
            document.querySelector('.login-card').classList.add('shimmer');
            setTimeout(() => {
                document.querySelector('.login-card').classList.remove('shimmer');
            }, 2000);
        }, 500);
    </script>
</body>

</html>
