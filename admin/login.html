<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background: #f8f9fa;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="bg-white p-5 rounded-card shadow-lg text-center mx-3" style="width: 100%; max-width: 400px;">
        <div class="mb-4">
            <h2 class="fw-bold text-dark">XICOMA</h2>
            <span class="badge bg-dark text-white text-uppercase px-3 py-1">Admin Panel</span>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" value="admin@xicoma.com">
                <label for="email">Email Admin</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" value="admin">
                <label for="password">Senha</label>
            </div>

            <button type="submit" id="btn-login" class="btn btn-dark w-100 py-3 rounded-pill fw-bold mb-3">Acessar
                Painel</button>
        </form>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            btn.innerText = 'Verificando...';
            btn.disabled = true;

            setTimeout(() => {
                if (xicoma.auth.login(email, password, 'admin')) {
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Acesso negado.');
                    btn.innerText = 'Acessar Painel';
                    btn.disabled = false;
                }
            }, 800);
        });
    </script>
</body>

</html>
