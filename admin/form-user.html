<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA Admin - Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background: #f0f2f5;
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .btn-close-custom {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f8f9fa;
            color: #333;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-close-custom:hover {
            background: #e9ecef;
            transform: rotate(90deg);
        }
    </style>
</head>

<body>

    <div class="form-card fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0" id="page-title">Novo Usuário</h3>
                <small class="text-muted">Preencha os dados de acesso</small>
            </div>
            <a href="usuarios.html" class="btn-close-custom"><i class="bi bi-x-lg"></i></a>
        </div>

        <form id="userForm">
            <div class="form-floating mb-3">
                <input type="text" id="name" class="form-control rounded-3" placeholder="Nome" required>
                <label for="name">Nome Completo</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" id="email" class="form-control rounded-3" placeholder="Email" required>
                <label for="email">Endereço de Email</label>
            </div>

            <div class="form-floating mb-4">
                <select id="role" class="form-select rounded-3">
                    <option value="client">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>
                <label for="role">Tipo de Permissão</label>
            </div>

            <div class="d-grid pt-2">
                <button type="submit" class="btn btn-primary-xicoma py-3 rounded-pill fw-bold shadow-sm">
                    Salvar Alterações
                </button>
            </div>
        </form>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('admin');

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') ? parseInt(params.get('id')) : null;

        if (id) {
            document.getElementById('page-title').innerText = 'Editar Usuário';
            const u = xicoma.db.get('users').find(i => i.id === id);
            if (u) {
                document.getElementById('name').value = u.name;
                document.getElementById('email').value = u.email;
                document.getElementById('role').value = u.role;
            }
        }

        document.getElementById('userForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                role: document.getElementById('role').value
            };

            if (id) {
                xicoma.db.update('users', id, data);
            } else {
                data.password = '123';
                xicoma.db.add('users', data);
            }
            window.location.href = 'usuarios.html';
        });
    </script>
</body>

</html>
