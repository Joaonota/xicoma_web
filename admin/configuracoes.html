<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA Admin - Configurações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .sidebar {
            width: 250px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            background-color: #212529;
            color: white;
            z-index: 100;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .nav-link {
            color: #aaa;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 2px;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-link i {
            width: 20px;
            margin-right: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="sidebar d-flex flex-column p-3">
        <h4 class="fw-bold mb-5 ps-2 text-white">XICOMA <small class="fs-6 text-muted">Admin</small></h4>
        <nav class="nav flex-column flex-grow-1">
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
            <a href="usuarios.html" class="nav-link"><i class="bi bi-people"></i> Usuários</a>
            <a href="restaurantes.html" class="nav-link"><i class="bi bi-shop"></i> Restaurantes</a>
            <a href="entregadores.html" class="nav-link"><i class="bi bi-bicycle"></i> Entregadores</a>
            <a href="comissoes.html" class="nav-link"><i class="bi bi-cash-stack"></i> Financeiro</a>
            <a href="configuracoes.html" class="nav-link active"><i class="bi bi-gear"></i> Configurações</a>
        </nav>
        <button onclick="xicoma.auth.logout()" class="btn btn-outline-secondary w-100 mt-auto btn-sm text-start ps-3"><i
                class="bi bi-box-arrow-left me-2"></i> Sair</button>
    </div>

    <div class="main-content">
        <h4 class="fw-bold mb-4">Configurações do Sistema</h4>

        <div class="card border-0 shadow-sm rounded-card p-4 mb-4">
            <h6 class="fw-bold mb-3">Geral</h6>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="maintMode">
                <label class="form-check-label" for="maintMode">Modo Manutenção (Bloquear app para clientes)</label>
            </div>
            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" id="regOpen" checked>
                <label class="form-check-label" for="regOpen">Permitir Novos Cadastros</label>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-card p-4">
            <h6 class="fw-bold mb-3">Financeiro Global</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small text-muted">Comissão Padrão (%)</label>
                    <input type="number" class="form-control" value="15">
                </div>
                <div class="col-md-6">
                    <label class="form-label small text-muted">Taxa Mínima de Entrega (MT)</label>
                    <input type="number" class="form-control" value="50">
                </div>
            </div>
            <div class="text-end mt-4">
                <button class="btn btn-primary-xicoma px-4 rounded-pill fw-bold"
                    onclick="alert('Configurações salvas!')">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('admin');
    </script>
</body>

</html>
