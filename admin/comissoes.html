<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA Admin - Financeiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .sidebar {
            width: 250px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            background-color: #212529;
            color: white;
            z-index: 100;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .nav-link {
            color: #aaa;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 2px;
        }

        .nav-link:hover,
        .nav-link.active {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-link i {
            width: 20px;
            margin-right: 10px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="sidebar d-flex flex-column p-3">
        <h4 class="fw-bold mb-5 ps-2 text-white">XICOMA <small class="fs-6 text-muted">Admin</small></h4>
        <nav class="nav flex-column flex-grow-1">
            <a href="dashboard.html" class="nav-link"><i class="bi bi-grid-fill"></i> Dashboard</a>
            <a href="usuarios.html" class="nav-link"><i class="bi bi-people"></i> Usuários</a>
            <a href="restaurantes.html" class="nav-link"><i class="bi bi-shop"></i> Restaurantes</a>
            <a href="entregadores.html" class="nav-link"><i class="bi bi-bicycle"></i> Entregadores</a>
            <a href="comissoes.html" class="nav-link active"><i class="bi bi-cash-stack"></i> Financeiro</a>
            <a href="configuracoes.html" class="nav-link"><i class="bi bi-gear"></i> Configurações</a>
        </nav>
        <button onclick="xicoma.auth.logout()" class="btn btn-outline-secondary w-100 mt-auto btn-sm text-start ps-3"><i
                class="bi bi-box-arrow-left me-2"></i> Sair</button>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">Financeiro da Plataforma</h4>
            <div class="btn-group">
                <button class="btn btn-light active">Hoje</button>
                <button class="btn btn-light">Semana</button>
                <button class="btn btn-light">Mês</button>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="bg-dark text-white p-4 rounded-card shadow-sm h-100">
                    <p class="text-white-50 mb-1">Volume Total de Vendas</p>
                    <h2 class="fw-bold mb-0" id="vol-total">0 MT</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-primary-xicoma text-white p-4 rounded-card shadow-sm h-100">
                    <p class="text-white-50 mb-1">Receita Líquida (15%)</p>
                    <h2 class="fw-bold mb-0" id="revenue">0 MT</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div
                    class="bg-white p-4 rounded-card shadow-sm h-100 border text-center d-flex flex-column justify-content-center">
                    <h5 class="fw-bold text-muted">Ticket Médio</h5>
                    <h3 class="fw-bold" id="ticket">0 MT</h3>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-card">
            <div class="card-header bg-white border-0 py-3">
                <h6 class="fw-bold m-0">Extrato de Comissões</h6>
            </div>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-3 border-0">Data</th>
                            <th class="border-0">Pedido</th>
                            <th class="border-0">Restaurante</th>
                            <th class="pe-3 border-0 text-end">Comissão (+15%)</th>
                        </tr>
                    </thead>
                    <tbody id="comm-list">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('admin');

        xicoma.db.init(); // Refresh
        const orders = xicoma.db.get('orders').filter(o => o.status === 'delivered');

        const volume = orders.reduce((s, o) => s + o.total, 0);
        const revenue = volume * 0.15;
        const avg = orders.length > 0 ? (volume / orders.length) : 0;

        document.getElementById('vol-total').innerText = xicoma.formatCurrency(volume);
        document.getElementById('revenue').innerText = xicoma.formatCurrency(revenue);
        document.getElementById('ticket').innerText = xicoma.formatCurrency(avg);

        const list = document.getElementById('comm-list');
        list.innerHTML = orders.reverse().map(o => `
            <tr>
                <td class="ps-3 text-muted small">${new Date(o.createdAt).toLocaleDateString()}</td>
                <td>#${o.id}</td>
                <td>${o.restaurantName}</td>
                <td class="pe-3 text-end fw-bold text-success">+${xicoma.formatCurrency(o.total * 0.15)}</td>
            </tr>
        `).join('');

        if (orders.length === 0) {
            list.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-muted">Sem dados financeiros.</td></tr>';
        }

    </script>
</body>

</html>
