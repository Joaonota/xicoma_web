<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA Admin - Entregador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            padding: 40px;
        }

        .btn-close-custom {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f8f9fa;
            color: #333;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-close-custom:hover {
            background: #e9ecef;
            transform: rotate(90deg);
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #adb5bd;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>

<body>

    <div class="form-card fade-in">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold m-0" id="page-title">Entregador</h3>
                <small class="text-muted">Cadastro de frota</small>
            </div>
            <a href="entregadores.html" class="btn-close-custom"><i class="bi bi-x-lg"></i></a>
        </div>

        <form id="courierForm">
            <span class="section-label">Dados Pessoais & Veículo</span>

            <div class="form-floating mb-3">
                <input type="text" id="name" class="form-control rounded-3" placeholder="Nome" required>
                <label for="name">Nome Completo</label>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <div class="form-floating">
                        <select id="vehicle" class="form-select rounded-3">
                            <option>Moto</option>
                            <option>Bicicleta</option>
                            <option>Carro</option>
                        </select>
                        <label for="vehicle">Veículo</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating">
                        <input type="text" id="plate" class="form-control rounded-3" placeholder="Placa" required>
                        <label for="plate">Placa / ID</label>
                    </div>
                </div>
            </div>

            <hr class="border-secondary opacity-10 my-4">
            <span class="section-label">Conta</span>

            <div class="form-floating mb-4">
                <input type="email" id="email" class="form-control rounded-3" placeholder="Email" required>
                <label for="email">Email</label>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary-xicoma py-3 rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-check2-circle me-2"></i> Salvar Entregador
                </button>
            </div>
        </form>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('admin');

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') ? parseInt(params.get('id')) : null;

        if (id) {
            document.getElementById('page-title').innerText = 'Editar Entregador';
            const c = xicoma.db.get('couriers').find(i => i.id === id);
            if (c) {
                document.getElementById('name').value = c.name;
                document.getElementById('vehicle').value = c.vehicle;
                document.getElementById('plate').value = c.plate;
                document.getElementById('email').value = c.email;
                document.getElementById('email').disabled = true;
            }
        }

        document.getElementById('courierForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                vehicle: document.getElementById('vehicle').value,
                plate: document.getElementById('plate').value,
                email: document.getElementById('email').value,
                status: 'livre'
            };

            if (id) {
                xicoma.db.update('couriers', id, data);
            } else {
                xicoma.db.add('couriers', data);
                // Create Login
                xicoma.db.add('users', {
                    name: data.name,
                    email: data.email,
                    password: '123',
                    role: 'courier'
                });
            }
            window.location.href = 'entregadores.html';
        });
    </script>
</body>

</html>
