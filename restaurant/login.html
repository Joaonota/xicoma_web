<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Portal do Parceiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            background-color: #212529;
            color: white;
        }

        .login-card {
            background-color: #2c3035;
            border: 1px solid #373b3e;
        }

        .form-control {
            background-color: #212529;
            border-color: #373b3e;
            color: white;
        }

        .form-control:focus {
            background-color: #212529;
            border-color: var(--xicoma-primary);
            color: white;
            box-shadow: none;
        }

        label {
            color: #aaa;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="login-card p-5 rounded-card shadow-lg" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h1 class="text-primary-xicoma fw-bold mb-0">XICOMA</h1>
            <small class="text-muted text-uppercase letter-spacing-2">Portal do Parceiro</small>
        </div>

        <form id="loginForm">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" value="bk@xicoma.com">
                <label for="email">Email Corporativo</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" value="123">
                <label for="password">Senha</label>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary-xicoma w-100 py-3 rounded-pill fw-bold">Entrar
                no Portal</button>
        </form>

        <div class="text-center mt-4">
            <a href="../client/login.html" class="text-decoration-none text-muted small me-3">Sou Cliente</a>
            <a href="../courier/login.html" class="text-decoration-none text-muted small">Sou Entregador</a>
        </div>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');

            btn.innerText = 'Verificando...';
            btn.disabled = true;

            setTimeout(() => {
                // Bypass authentication - allow any credentials
                window.location.href = 'dashboard.html';
            }, 800);
        });
    </script>
</body>

</html>
