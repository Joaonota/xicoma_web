<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Perfil Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="d-flex align-items-center mb-4">
                    <a href="dashboard.html" class="btn btn-light rounded-circle me-3"><i
                            class="bi bi-arrow-left"></i></a>
                    <h4 class="fw-bold m-0">Perfil da Loja</h4>
                </div>

                <div class="card border-0 shadow-sm rounded-card p-4 text-center mb-4">
                    <img id="r-img" src="" class="rounded-circle object-fit-cover mx-auto mb-3"
                        style="width: 100px; height: 100px;">
                    <h4 class="fw-bold mb-1" id="r-name">...</h4>
                    <p class="text-muted" id="r-cat">...</p>

                    <div class="d-flex justify-content-center gap-3 mt-3">
                        <div class="text-center px-3 border-end">
                            <h5 class="fw-bold m-0">4.8</h5>
                            <small class="text-muted">Avaliação</small>
                        </div>
                        <div class="text-center px-3">
                            <h5 class="fw-bold m-0">120</h5>
                            <small class="text-muted">Pedidos</small>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-card mb-4">
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action py-3 px-4">
                            <i class="bi bi-clock me-2 text-primary-xicoma"></i> Horário de Funcionamento
                        </a>
                        <a href="#" class="list-group-item list-group-item-action py-3 px-4">
                            <i class="bi bi-geo-alt me-2 text-primary-xicoma"></i> Endereço
                        </a>
                        <a href="#" class="list-group-item list-group-item-action py-3 px-4">
                            <i class="bi bi-shield-lock me-2 text-primary-xicoma"></i> Alterar Senha
                        </a>
                    </div>
                </div>

                <button onclick="xicoma.auth.logout()" class="btn btn-outline-danger w-100 py-2">Sair do Portal</button>
            </div>
        </div>
    </div>

    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('restaurant');
        const user = xicoma.auth.currentUser;

        document.getElementById('r-name').innerText = user.name;
        document.getElementById('r-cat').innerText = user.category;
        document.getElementById('r-img').src = user.image;

    </script>
</body>

</html>
