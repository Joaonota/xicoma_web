<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Gestão de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container-fluid p-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="dashboard.html" class="btn btn-light rounded-circle me-2"><i class="bi bi-arrow-left"></i></a>
                <span class="h4 fw-bold align-middle">Pedidos em Andamento</span>
            </div>
            <button onclick="renderBoard()" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-clockwise"></i>
                Atualizar</button>
        </div>

        <div class="row g-3" style="min-height: 80vh;">
            <!-- Pending -->
            <div class="col-md-4">
                <div class="bg-white rounded-card shadow-sm h-100 d-flex flex-column">
                    <div class="p-3 border-bottom bg-danger text-white rounded-top"
                        style="border-radius: 12px 12px 0 0;">
                        <h6 class="fw-bold m-0"><i class="bi bi-bell-fill me-2"></i> Novos (<span
                                id="count-pending">0</span>)</h6>
                    </div>
                    <div class="p-3 d-flex flex-column gap-3 flex-grow-1 bg-light" id="col-pending">
                        <!-- Items -->
                    </div>
                </div>
            </div>

            <!-- Preparing -->
            <div class="col-md-4">
                <div class="bg-white rounded-card shadow-sm h-100 d-flex flex-column">
                    <div class="p-3 border-bottom bg-warning text-dark rounded-top"
                        style="border-radius: 12px 12px 0 0;">
                        <h6 class="fw-bold m-0"><i class="bi bi-fire me-2"></i> Na Cozinha (<span
                                id="count-preparing">0</span>)</h6>
                    </div>
                    <div class="p-3 d-flex flex-column gap-3 flex-grow-1 bg-light" id="col-preparing">
                        <!-- Items -->
                    </div>
                </div>
            </div>

            <!-- Ready -->
            <div class="col-md-4">
                <div class="bg-white rounded-card shadow-sm h-100 d-flex flex-column">
                    <div class="p-3 border-bottom bg-success text-white rounded-top"
                        style="border-radius: 12px 12px 0 0;">
                        <h6 class="fw-bold m-0"><i class="bi bi-check-circle-fill me-2"></i> Prontos / Aguardando (<span
                                id="count-ready">0</span>)</h6>
                    </div>
                    <div class="p-3 d-flex flex-column gap-3 flex-grow-1 bg-light" id="col-ready">
                        <!-- Items -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal fade" id="orderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Detalhes do Pedido</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body">
                    <!-- Dynamic -->
                </div>
                <div class="modal-footer border-0 bg-light" id="modal-footer">
                    <!-- Actions -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('restaurant');
        const rid = xicoma.auth.currentUser.id;

        function renderBoard() {
            // Reload DB
            xicoma.db.init();
            const orders = xicoma.db.get('orders').filter(o => o.restaurantId === rid);

            const pending = orders.filter(o => o.status === 'pending');
            const preparing = orders.filter(o => o.status === 'preparing');
            const ready = orders.filter(o => o.status === 'ready');

            document.getElementById('count-pending').innerText = pending.length;
            document.getElementById('count-preparing').innerText = preparing.length;
            document.getElementById('count-ready').innerText = ready.length;

            renderCol('col-pending', pending, 'pending');
            renderCol('col-preparing', preparing, 'preparing');
            renderCol('col-ready', ready, 'ready');
        }

        function renderCol(colId, items, status) {
            const container = document.getElementById(colId);
            container.innerHTML = items.map(o => `
                <div class="card border-0 shadow-sm fade-in">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="fw-bold">#${o.id.toString().slice(-4)}</span>
                            <small class="text-muted">${o.clientName}</small>
                        </div>
                        <p class="small text-muted mb-2">${o.items.length} itens • ${xicoma.formatCurrency(o.total)}</p>
                        <button class="btn btn-sm w-100 ${getBtnClass(status)}" onclick="openOrder(${o.id})">
                             ${getBtnLabel(status)}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getBtnClass(s) {
            if (s === 'pending') return 'btn-outline-danger';
            if (s === 'preparing') return 'btn-outline-warning text-dark';
            return 'btn-outline-success';
        }

        function getBtnLabel(s) {
            if (s === 'pending') return 'Aceitar / Detalhes';
            if (s === 'preparing') return 'Marcar Pronto';
            return 'Ver Detalhes';
        }

        window.openOrder = (oid) => {
            const order = xicoma.db.get('orders').find(o => o.id === oid);
            if (!order) return;

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="alert alert-secondary mb-3 small">
                    <i class="bi bi-clock"></i> Pedido feito às ${new Date(order.createdAt).toLocaleTimeString()}
                </div>
                <h6 class="fw-bold">Itens:</h6>
                <ul class="list-group list-group-flush mb-3">
                    ${order.items.map(i => `<li class="list-group-item px-0 d-flex justify-content-between">
                        <span>${i.qty}x ${i.name}</span>
                        <span>${xicoma.formatCurrency(i.price * i.qty)}</span>
                    </li>`).join('')}
                </ul>
                <div class="d-flex justify-content-between fw-bold pt-2 border-top">
                    <span>Total</span>
                    <span>${xicoma.formatCurrency(order.total)}</span>
                </div>
            `;

            const footer = document.getElementById('modal-footer');
            if (order.status === 'pending') {
                footer.innerHTML = `
                    <button class="btn btn-danger me-auto" onclick="updateStatus(${order.id}, 'rejected')">Rejeitar</button>
                    <button class="btn btn-success fw-bold px-4" onclick="updateStatus(${order.id}, 'preparing')">Aceitar Pedido</button>
                `;
            } else if (order.status === 'preparing') {
                footer.innerHTML = `
                    <button class="btn btn-success fw-bold w-100" onclick="updateStatus(${order.id}, 'ready')">Pronto para Coleta <i class="bi bi-check-lg"></i></button>
                `;
            } else {
                footer.innerHTML = `<span class="text-success fw-bold w-100 text-center"><i class="bi bi-bicycle"></i> Aguardando Entregador</span>`;
            }

            new bootstrap.Modal(document.getElementById('orderModal')).show();
        };

        window.updateStatus = (oid, status) => {
            if (status === 'rejected') {
                if (!confirm('Rejeitar este pedido?')) return;
                // Delete or move to history? Let's keep specific logic simple
                xicoma.db.update('orders', oid, { status: 'rejected' }); // In reality might delete
            } else {
                xicoma.db.update('orders', oid, { status: status });
            }

            bootstrap.Modal.getInstance(document.getElementById('orderModal')).hide();
            renderBoard();
        };

        renderBoard();
        setInterval(renderBoard, 5000); // Live refresh

    </script>
</body>

</html>
