<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XICOMA - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="container-fluid p-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="dashboard.html" class="btn btn-light rounded-circle me-2"><i class="bi bi-arrow-left"></i></a>
                <span class="h4 fw-bold align-middle">Meu Cardápio</span>
            </div>
            <a href="produto-form.html" class="btn btn-primary-xicoma rounded-pill px-4"><i class="bi bi-plus-lg"></i>
                Novo Item</a>
        </div>

        <div class="card border-0 shadow-sm rounded-card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table align-middle table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4 py-3 border-0">Produto</th>
                                <th class="py-3 border-0">Descrição</th>
                                <th class="py-3 border-0">Preço</th>
                                <th class="pe-4 py-3 border-0 text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="menu-list">
                            <!-- JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('restaurant');
        const rid = xicoma.auth.currentUser.id;

        function renderMenu() {
            xicoma.db.init(); // Sync
            const products = xicoma.db.get('products').filter(p => p.restaurantId === rid);
            const list = document.getElementById('menu-list');

            if (products.length === 0) {
                list.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">Ainda não há itens no cardápio.</td></tr>';
                return;
            }

            list.innerHTML = products.map(p => `
                <tr class="fade-in">
                    <td class="ps-4">
                        <div class="d-flex align-items-center">
                            <img src="${p.image}" class="rounded-3 object-fit-cover me-3" style="width: 50px; height: 50px;">
                            <span class="fw-bold">${p.name}</span>
                        </div>
                    </td>
                    <td class="text-muted small" style="max-width: 250px;">${p.description}</td>
                    <td class="fw-bold text-success">${xicoma.formatCurrency(p.price)}</td>
                    <td class="pe-4 text-end">
                        <a href="produto-form.html?id=${p.id}" class="btn btn-sm btn-light me-1"><i class="bi bi-pencil"></i></a>
                        <button onclick="deleteProduct(${p.id})" class="btn btn-sm btn-light text-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        window.deleteProduct = (pid) => {
            if (confirm('Tem certeza que deseja apagar este item?')) {
                xicoma.db.delete('products', pid);
                renderMenu();
                // Simple Toast
                const t = document.createElement('div');
                t.innerHTML = `<div class="toast show text-bg-warning border-0 p-3">Produto removido!</div>`;
                document.getElementById('toast-container').appendChild(t);
                setTimeout(() => t.remove(), 2000);
            }
        };

        renderMenu();
    </script>
</body>

</html>
