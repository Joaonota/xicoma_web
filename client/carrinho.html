<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <div class="p-3 bg-white shadow-sm d-flex align-items-center mb-3">
            <a href="javascript:history.back()" class="btn btn-light rounded-circle me-3"><i
                    class="bi bi-arrow-left"></i></a>
            <h5 class="fw-bold m-0">Seu Carrinho</h5>
        </div>

        <div class="p-3" style="padding-bottom: 100px;">
            <div id="cart-list"></div>

            <div class="bg-white p-3 rounded-card shadow-sm mt-3 fade-in">
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Subtotal</span>
                    <span class="fw-bold" id="subtotal">0 MT</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Taxa de Entrega</span>
                    <span class="fw-bold text-success" id="fee">0 MT</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between">
                    <span class="fw-bold fs-5">Total</span>
                    <span class="fw-bold fs-5 text-primary-xicoma" id="total">0 MT</span>
                </div>
            </div>
        </div>

        <div class="fixed-bottom p-3" style="max-width: 480px; margin: 0 auto;">
            <button onclick="goToPayment()" id="btn-checkout"
                class="btn btn-primary-xicoma w-100 py-3 rounded-pill fw-bold shadow-lg">
                Ir para o Pagamento
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('client');

        function renderCart() {
            const list = document.getElementById('cart-list');
            const items = xicoma.cart.items;

            if (items.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-cart-x display-1 text-muted opacity-25"></i>
                        <p class="mt-3 fw-bold text-muted">Seu carrinho está vazio</p>
                        <a href="home.html" class="btn btn-outline-secondary mt-2">Explorar Restaurantes</a>
                    </div>
                `;
                document.getElementById('btn-checkout').disabled = true;
                updateTotals(0, 0);
                return;
            }

            document.getElementById('btn-checkout').disabled = false;

            // Get Restaurant Info for Fee
            const restId = xicoma.cart.restaurantId;
            const rest = xicoma.db.get('restaurants').find(r => r.id === restId);
            const fee = rest ? rest.deliveryFee : 0;

            list.innerHTML = items.map(i => `
                <div class="card border-0 shadow-sm rounded-card mb-3 p-2 fade-in">
                    <div class="d-flex align-items-center">
                        <img src="${i.image}" class="rounded-3 object-fit-cover" style="width: 60px; height: 60px;">
                        <div class="ms-3 flex-grow-1">
                            <h6 class="fw-bold mb-0">${i.name}</h6>
                            <span class="text-muted small">${xicoma.formatCurrency(i.price)}</span>
                        </div>
                        <div class="d-flex align-items-center bg-light rounded-pill px-2 py-1">
                            <button class="btn btn-sm p-0 text-muted" onclick="changeQty(${i.id}, -1)"><i class="bi bi-dash"></i></button>
                            <span class="mx-2 fw-bold small">${i.qty}</span>
                            <button class="btn btn-sm p-0 text-primary-xicoma" onclick="changeQty(${i.id}, 1)"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');

            updateTotals(xicoma.cart.total(), fee);
        }

        function updateTotals(subtotal, fee) {
            document.getElementById('subtotal').innerText = xicoma.formatCurrency(subtotal);
            document.getElementById('fee').innerText = xicoma.formatCurrency(fee);
            document.getElementById('total').innerText = xicoma.formatCurrency(subtotal + fee);
        }

        window.changeQty = (id, delta) => {
            const item = xicoma.cart.items.find(i => i.id === id);
            if (item) {
                if (item.qty + delta <= 0) {
                    if (confirm('Remover item?')) xicoma.cart.remove(id);
                } else {
                    item.qty += delta;
                    xicoma.cart.save();
                }
                renderCart();
            }
        };

        window.goToPayment = () => {
            window.location.href = 'pagamento.html';
        };

        renderCart();
    </script>
</body>

</html>
