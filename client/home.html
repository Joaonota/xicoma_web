<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Início</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <!-- Header -->
        <div class="bg-white p-3 shadow-sm sticky-top">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-geo-alt-fill text-primary-xicoma me-2"></i>
                    <div>
                        <small class="text-muted d-block" style="font-size: 10px;">Entregar em:</small>
                        <span class="fw-bold small">Maputo, Polana Cimento</span> <i
                            class="bi bi-chevron-down small"></i>
                    </div>
                </div>
                <div class="position-relative">
                    <i class="bi bi-bell fs-5"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
                </div>
            </div>

            <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Buscar em Xicoma...">
            </div>
        </div>

        <!-- Scroll Content -->
        <div class="p-3">

            <!-- Banners -->
            <div class="card bg-primary-xicoma text-white border-0 rounded-card mb-4 p-3 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="fw-bold mb-1">Frete Grátis</h5>
                        <small>Em pedidos acima de 500 MT</small>
                    </div>
                    <i class="bi bi-bicycle display-4 opacity-50"></i>
                </div>
            </div>

            <!-- Categories -->
            <h6 class="fw-bold mb-3">Categorias</h6>
            <div class="d-flex overflow-auto pb-2 mb-4 hide-scrollbar" style="gap: 15px;">
                <div class="text-center">
                    <div class="bg-white p-3 rounded-circle shadow-sm mb-2"
                        style="width: 70px; height: 70px; display: grid; place-items: center;">
                        <i class="bi bi-burger fs-3 text-warning"></i>
                    </div>
                    <small class="fw-bold text-muted" style="font-size: 11px;">Lanches</small>
                </div>
                <div class="text-center">
                    <div class="bg-white p-3 rounded-circle shadow-sm mb-2"
                        style="width: 70px; height: 70px; display: grid; place-items: center;">
                        <i class="bi bi-pizza fs-3 text-danger"></i>
                    </div>
                    <small class="fw-bold text-muted" style="font-size: 11px;">Pizza</small>
                </div>
                <div class="text-center">
                    <div class="bg-white p-3 rounded-circle shadow-sm mb-2"
                        style="width: 70px; height: 70px; display: grid; place-items: center;">
                        <i class="bi bi-egg-fried fs-3 text-success"></i>
                    </div>
                    <small class="fw-bold text-muted" style="font-size: 11px;">Saudável</small>
                </div>
                <div class="text-center">
                    <div class="bg-white p-3 rounded-circle shadow-sm mb-2"
                        style="width: 70px; height: 70px; display: grid; place-items: center;">
                        <i class="bi bi-cup-hot fs-3 text-info"></i>
                    </div>
                    <small class="fw-bold text-muted" style="font-size: 11px;">Bebidas</small>
                </div>
                <div class="text-center">
                    <div class="bg-white p-3 rounded-circle shadow-sm mb-2"
                        style="width: 70px; height: 70px; display: grid; place-items: center;">
                        <i class="bi bi-basket fs-3 text-primary"></i>
                    </div>
                    <small class="fw-bold text-muted" style="font-size: 11px;">Mercado</small>
                </div>
            </div>

            <!-- Restaurants -->
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold m-0">Restaurantes Populares</h6>
                <a href="restaurantes.html" class="text-primary-xicoma text-decoration-none small fw-bold">Ver todos</a>
            </div>

            <div id="rest-list">
                <!-- JS Populated -->
                <div class="text-center py-5">
                    <div class="spinner-border text-primary-xicoma" role="status"></div>
                </div>
            </div>

        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item active">
                <i class="bi bi-house-door-fill"></i> Início
            </a>
            <a href="restaurantes.html" class="nav-item">
                <i class="bi bi-search"></i> Busca
            </a>
            <a href="humaita.html" class="nav-item">
                <i class="bi bi-receipt"></i> Pedidos
            </a>
            <a href="perfil.html" class="nav-item">
                <i class="bi bi-person"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        // Init
        xicoma.auth.checkAccess('client');

        // Load Restaurants
        const list = document.getElementById('rest-list');
        const rests = xicoma.db.get('restaurants');

        if (rests.length === 0) {
            list.innerHTML = '<p class="text-muted text-center">Nenhum restaurante encontrado.</p>';
        } else {
            list.innerHTML = rests.map(r => `
                <a href="restaurante-detalhe.html?id=${r.id}" class="text-decoration-none text-dark">
                    <div class="card border-0 shadow-sm rounded-card mb-3 fade-in">
                        <div class="row g-0">
                            <div class="col-4">
                                <img src="${r.image}" class="img-fluid h-100 object-fit-cover" style="min-height: 100px;">
                            </div>
                            <div class="col-8">
                                <div class="card-body p-3">
                                    <h6 class="card-title fw-bold mb-1">${r.name}</h6>
                                    <p class="card-text small text-muted mb-1">
                                        <i class="bi bi-star-fill text-warning"></i> ${r.rating} • ${r.category}
                                    </p>
                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                        <small class="text-muted"><i class="bi bi-clock"></i> ${r.deliveryTime}</small>
                                        <span class="badge bg-light text-success border border-success">${r.deliveryFee === 0 ? 'Grátis' : xicoma.formatCurrency(r.deliveryFee)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            `).join('');
        }
    </script>
</body>

</html>
