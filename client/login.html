<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Login Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-white">

    <div class="app-container d-flex flex-column justify-content-center px-4" style="height: 100vh; padding-bottom: 0;">
        <div class="text-center mb-5 fade-in">
            <h1 class="text-primary-xicoma fw-bold display-4 mb-2">XICOMA</h1>
            <p class="text-muted">Seu delivery favorito em Maputo</p>
        </div>

        <form id="loginForm" class="fade-in">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com"
                    value="cliente@xicoma.com">
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" value="123">
                <label for="password">Senha</label>
            </div>

            <button type="submit" id="btn-login"
                class="btn btn-primary-xicoma btn-lg w-100 mb-3 shadow-sm">Entrar</button>
            <a href="register.html" class="btn btn-outline-xicoma btn-lg w-100">Criar Conta</a>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-muted small text-decoration-none">Esqueci minha senha</a>
        </div>

        <div class="mt-5 text-center small text-muted">
            <a href="../admin/login.html" class="text-decoration-none text-muted me-3">Admin</a>
            <a href="../restaurant/login.html" class="text-decoration-none text-muted me-3">Restaurante</a>
            <a href="../courier/login.html" class="text-decoration-none text-muted">Entregador</a>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            // Simulate Loading
            const originalText = btn.innerText;
            btn.innerText = 'Autenticando...';
            btn.disabled = true;

            setTimeout(() => {
                if (xicoma.auth.login(email, password, 'client')) {
                    window.location.href = 'home.html';
                } else {
                    alert('Credenciais inválidas! Tente cliente@xicoma.com / 123');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }, 1000);
        });
    </script>
</body>

</html>
