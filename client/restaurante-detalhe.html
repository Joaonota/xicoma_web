<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Cardápio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .cover-img {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        .rest-info {
            margin-top: -30px;
            border-radius: 20px 20px 0 0;
            position: relative;
            background: white;
            padding: 20px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="app-container" style="padding-bottom: 100px;">
        <div class="position-relative">
            <a href="javascript:history.back()"
                class="btn btn-light rounded-circle position-absolute top-0 start-0 m-3 shadow-sm z-3"><i
                    class="bi bi-arrow-left"></i></a>
            <img id="cover" src="" class="cover-img">
        </div>

        <div class="rest-info shadow-sm">
            <div class="d-flex justify-content-between align-items-start">
                <h2 class="fw-bold mb-0" id="name">...</h2>
                <div class="bg-light px-2 py-1 rounded small fw-bold">
                    <i class="bi bi-star-fill text-warning"></i> <span id="rating">0.0</span>
                </div>
            </div>
            <p class="text-muted small mt-2 mb-3">
                <span id="category">...</span> • <span id="time">...</span> • <span id="fee">...</span>
            </p>

            <div class="input-group">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control bg-light border-0" placeholder="Buscar no cardápio">
            </div>
        </div>

        <div class="p-3">
            <h5 class="fw-bold mb-3">Destaques</h5>
            <div id="product-list">
                <!-- Products -->
            </div>
        </div>

        <!-- Floating Cart Button -->
        <div id="float-cart" class="fixed-bottom p-3 d-none" style="max-width: 480px; margin: 0 auto;">
            <a href="carrinho.html"
                class="btn btn-primary-xicoma w-100 py-3 shadow-lg d-flex justify-content-between align-items-center rounded-pill">
                <span class="badge bg-white text-danger fw-bold ms-2" id="cart-qty">0</span>
                <span class="fw-bold">Ver Carrinho</span>
                <span class="fw-bold me-2" id="cart-total">0 MT</span>
            </a>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('client');

        // Get ID from URL
        const params = new URLSearchParams(window.location.search);
        const id = parseInt(params.get('id'));

        const restaurant = xicoma.db.get('restaurants').find(r => r.id === id);
        if (!restaurant) {
            alert('Restaurante não encontrado');
            window.location.href = 'home.html';
        }

        // Fill Info
        document.getElementById('cover').src = restaurant.image;
        document.getElementById('name').innerText = restaurant.name;
        document.getElementById('rating').innerText = restaurant.rating;
        document.getElementById('category').innerText = restaurant.category;
        document.getElementById('time').innerText = restaurant.deliveryTime;
        document.getElementById('fee').innerText = "Entrega: " + xicoma.formatCurrency(restaurant.deliveryFee);

        // Render Products
        const products = xicoma.db.get('products').filter(p => p.restaurantId === id);
        const list = document.getElementById('product-list');

        list.innerHTML = products.map(p => `
            <div class="d-flex justify-content-between align-items-center border-bottom py-3 fade-in">
                <div class="me-3" style="flex: 1;">
                    <h6 class="fw-bold mb-1">${p.name}</h6>
                    <p class="small text-muted mb-2 line-clamp-2">${p.description}</p>
                    <div class="fw-bold text-primary-xicoma">${xicoma.formatCurrency(p.price)}</div>
                </div>
                <div class="position-relative">
                    <img src="${p.image}" class="rounded-3 object-fit-cover" style="width: 90px; height: 90px;">
                    <button class="btn btn-sm btn-light position-absolute bottom-0 end-0 m-1 rounded-circle shadow-sm"
                        onclick="addToCart(${p.id})">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                </div>
            </div>
        `).join('');

        // Cart Logic
        function updateFloatingCart() {
            if (xicoma.cart.items.length > 0) {
                document.getElementById('float-cart').classList.remove('d-none');

                const qty = xicoma.cart.items.reduce((s, i) => s + i.qty, 0);
                const total = xicoma.cart.total();

                document.getElementById('cart-qty').innerText = qty;
                document.getElementById('cart-total').innerText = xicoma.formatCurrency(total);
            } else {
                document.getElementById('float-cart').classList.add('d-none');
            }
        }

        window.addToCart = (pid) => {
            const prod = products.find(p => p.id === pid);
            xicoma.cart.add(prod, id);

            // Simple Feedback
            const toast = document.createElement('div');
            toast.className = "toast show text-bg-success align-items-center border-0 mb-2";
            toast.innerHTML = `<div class="d-flex"><div class="toast-body">${prod.name} adicionado!</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 2000);

            updateFloatingCart();
        };

        // Init Cart State
        updateFloatingCart();

    </script>
</body>

</html>
