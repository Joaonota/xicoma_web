<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-white">

    <div class="app-container px-4 py-5" style="padding-bottom: 0;">
        <div class="mb-4">
            <a href="login.html" class="btn btn-light rounded-circle shadow-sm"><i class="bi bi-arrow-left"></i></a>
        </div>

        <h2 class="fw-bold mb-4">Crie sua conta</h2>

        <form id="registerForm" class="fade-in">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" placeholder="Nome" required>
                <label for="name">Nome Completo</label>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
                <label for="email">Email</label>
            </div>
            <div class="form-floating mb-3">
                <input type="tel" class="form-control" id="phone" placeholder="Telefone" required>
                <label for="phone">Telefone (+258...)</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                <label for="password">Senha</label>
            </div>

            <button type="submit" id="btn-reg"
                class="btn btn-primary-xicoma btn-lg w-100 mb-3 shadow-sm">Cadastrar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-reg');

            const newUser = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: 'client'
            };

            // Loading
            btn.innerText = 'Criando conta...';
            btn.disabled = true;

            setTimeout(() => {
                xicoma.db.add('users', newUser);
                // Auto login
                xicoma.auth.login(newUser.email, newUser.password, 'client');
                alert('Conta criada com sucesso!');
                window.location.href = 'home.html';
            }, 1000);
        });
    </script>
</body>

</html>
