<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Restaurantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <!-- Header -->
        <div class="bg-white p-3 shadow-sm sticky-top">
            <h5 class="fw-bold m-0">Restaurantes</h5>
            <div class="input-group mt-3">
                <span class="input-group-text bg-light border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="search" class="form-control bg-light border-0" placeholder="Buscar parceiro..."
                    onkeyup="filterRestaurants()">
            </div>

            <!-- Filter Chips -->
            <div class="d-flex overflow-auto mt-3 pb-1 hide-scrollbar" style="gap: 10px;">
                <button class="btn btn-sm btn-dark rounded-pill px-3">Todos</button>
                <button class="btn btn-sm btn-light border rounded-pill px-3">Lanches</button>
                <button class="btn btn-sm btn-light border rounded-pill px-3">Pizza</button>
                <button class="btn btn-sm btn-light border rounded-pill px-3">Japonês</button>
                <button class="btn btn-sm btn-light border rounded-pill px-3">Doces</button>
            </div>
        </div>

        <!-- List -->
        <div class="p-3" id="rest-list">
            <div class="text-center py-5">
                <div class="spinner-border text-primary-xicoma" role="status"></div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <i class="bi bi-house-door"></i> Início
            </a>
            <a href="restaurantes.html" class="nav-item active">
                <i class="bi bi-search-heart-fill"></i> Busca
            </a>
            <a href="humaita.html" class="nav-item">
                <i class="bi bi-receipt"></i> Pedidos
            </a>
            <a href="perfil.html" class="nav-item">
                <i class="bi bi-person"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('client');

        function render(items) {
            const list = document.getElementById('rest-list');
            if (items.length === 0) {
                list.innerHTML = '<div class="text-center mt-5 text-muted"><i class="bi bi-emoji-frown display-1"></i><p class="mt-3">Nenhum resultado.</p></div>';
                return;
            }
            list.innerHTML = items.map(r => `
               <a href="restaurante-detalhe.html?id=${r.id}" class="text-decoration-none text-dark">
                    <div class="card border-0 shadow-sm rounded-card mb-3 fade-in">
                        <div class="row g-0">
                            <div class="col-4">
                                <img src="${r.image}" class="img-fluid h-100 object-fit-cover" style="min-height: 100px;">
                            </div>
                            <div class="col-8">
                                <div class="card-body p-3">
                                    <h6 class="card-title fw-bold mb-1">${r.name}</h6>
                                    <p class="card-text small text-muted mb-1">
                                        <i class="bi bi-star-fill text-warning"></i> ${r.rating} • ${r.category}
                                    </p>
                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                        <small class="text-muted"><i class="bi bi-clock"></i> ${r.deliveryTime}</small>
                                        <span class="badge bg-light text-success border border-success">${r.deliveryFee === 0 ? 'Grátis' : xicoma.formatCurrency(r.deliveryFee)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        const allRests = xicoma.db.get('restaurants');
        render(allRests);

        function filterRestaurants() {
            const term = document.getElementById('search').value.toLowerCase();
            const filtered = allRests.filter(r => r.name.toLowerCase().includes(term) || r.category.toLowerCase().includes(term));
            render(filtered);
        }
    </script>
</body>

</html>
