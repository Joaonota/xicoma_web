<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XICOMA - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="bg-light">

    <div class="app-container">
        <div class="bg-white p-4 shadow-sm mb-3 text-center">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                style="width: 80px; height: 80px;">
                <i class="bi bi-person display-6 text-primary-xicoma"></i>
            </div>
            <h5 class="fw-bold mb-0" id="u-name">...</h5>
            <small class="text-muted" id="u-email">...</small>
        </div>

        <div class="p-3">
            <div class="list-group rounded-card shadow-sm border-0 mb-4 bg-white">
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i
                        class="bi bi-wallet2 me-2"></i> Pagamentos</a>
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i
                        class="bi bi-geo-alt me-2"></i> Endereços</a>
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i class="bi bi-bell me-2"></i>
                    Notificações</a>
                <a href="#" class="list-group-item list-group-item-action border-0 py-3"><i
                        class="bi bi-question-circle me-2"></i> Ajuda</a>
            </div>

            <button onclick="xicoma.auth.logout()" class="btn btn-outline-danger w-100 py-3 rounded-pill fw-bold">
                Sair da Conta
            </button>
        </div>

        <nav class="bottom-nav">
            <a href="home.html" class="nav-item">
                <i class="bi bi-house-door"></i> Início
            </a>
            <a href="restaurantes.html" class="nav-item">
                <i class="bi bi-search"></i> Busca
            </a>
            <a href="historico.html" class="nav-item">
                <i class="bi bi-receipt"></i> Pedidos
            </a>
            <a href="perfil.html" class="nav-item active">
                <i class="bi bi-person-fill"></i> Perfil
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../mock-data/db.js"></script>
    <script src="../assets/js/core.js"></script>
    <script>
        xicoma.auth.checkAccess('client');
        document.getElementById('u-name').innerText = xicoma.auth.currentUser.name;
        document.getElementById('u-email').innerText = xicoma.auth.currentUser.email;
    </script>
</body>

</html>
